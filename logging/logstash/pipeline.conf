# Logstash pipeline (issue #59): Beats in, normalized events out to
# Elasticsearch.
#
# Two populations arrive on the same input:
#   - services and the gateway emit structured slog JSON per
#     docs/NEW-SERVICE.md §9 — these are parsed and indexed under the ILM
#     rollover alias ftx-logs-app;
#   - infrastructure containers (postgres, exporters, ...) emit plain text —
#     parsing them fails, which is the routing signal: they keep their raw
#     line and land in the daily ftx-logs-raw-* indices instead of being
#     dropped. The same path is the dead-letter route for a service that
#     suddenly emits garbage.

input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
  }

  if "_jsonparsefailure" in [tags] {
    # Plain-text or malformed: preserve the line verbatim, identify the
    # source container so Kibana can still filter by service.
    mutate {
      add_field => {
        "service" => "%{[container][name]}"
        "level"   => "INFO"
      }
    }
  } else {
    # Structured service logs: normalize the contract fields.
    date {
      match  => ["time", "ISO8601"]
      target => "@timestamp"
    }
    if [msg] {
      mutate { rename => { "msg" => "message" } }
    }
    if ![level] {
      mutate { add_field => { "level" => "INFO" } }
    }
    if ![service] {
      mutate { add_field => { "service" => "%{[container][name]}" } }
    }
    mutate { remove_field => ["time"] }
  }

  # Environment metadata (issue #59): every event records where it ran.
  mutate { add_field => { "environment" => "${APP_ENV}" } }
}

output {
  if "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      user            => "${LOGSTASH_USER}"
      password        => "${LOGSTASH_PASSWORD}"
      index           => "ftx-logs-raw-%{+YYYY.MM.dd}"
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      user            => "${LOGSTASH_USER}"
      password        => "${LOGSTASH_PASSWORD}"
      # Writes go to the rollover alias bootstrapped by scripts/elk-setup.sh;
      # ES-side ILM (issue #62) rolls the backing ftx-logs-app-* indices daily /
      # at 10 GB and deletes them 30 days later, moving the alias itself.
      index           => "ftx-logs-app"
      manage_template => false
    }
  }
}