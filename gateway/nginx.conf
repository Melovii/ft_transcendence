# Gateway configuration: TLS termination, static SPA, /api proxy.
# The ModSecurity WAF attaches to this nginx in Phase 5 of the roadmap.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Container stdout goes to the ELK pipeline in Phase 3.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
      '"request_time":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Avatars arrive in Phase 1+; 2m leaves room without inviting abuse.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 443 ssl;
        http2 on;

        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # Baseline security headers; the WAF (Phase 5) extends these.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA: serve static assets, fall back to index.html for client routes.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Auth service. Same-origin model: the browser only ever talks to :443.
        location /api/ {
            proxy_pass http://auth-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # WebSocket gateways (game, chat) land in Phase 4; the upgrade recipe:
        #
        # location /ws {
        #     proxy_pass http://game-gateway:8081;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_read_timeout 300s;
        # }
    }
}