# Containerized ft_transcendence stack.
# Run with: make up   (or: docker compose up -d --build)
#
# Topology (Phase 0):
#   browser --HTTPS:443--> gateway (nginx) --/api--> auth-service --> postgres
#
# Networks:
#   web — gateway <-> auth-service (the only network with published access)
#   db  — auth-service <-> postgres <-> migrate, internal (no outbound route)

name: ftx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db
    restart: unless-stopped

  # One-shot job: applies auth-service migrations (golang-migrate naming
  # convention: NNNNNN_name.up.sql / .down.sql, tracked in schema_migrations).
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/auth-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    restart: "no"

  # ── service template: copy this block per docs/NEW-SERVICE.md ────────────
  # my-service:
  #   build:
  #     context: ./backend
  #     dockerfile: my-service/Dockerfile
  #   environment:
  #     PORT: "8080"
  #     APP_ENV: ${APP_ENV}
  #     LOG_FORMAT: ${LOG_FORMAT}
  #     LOG_LEVEL: ${LOG_LEVEL}
  #     # only the env this service actually needs:
  #     # DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mydb?sslmode=disable
  #     # JWT_SECRET: ${JWT_SECRET}
  #   networks:
  #     - web        # always, if the gateway routes to it
  #     # - db        # only if it owns SQL tables
  #   restart: unless-stopped
  # ──────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web
      - db
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service
    networks:
      - web
    restart: unless-stopped

networks:
  web:
  db:
    internal: true

volumes:
  pgdata: