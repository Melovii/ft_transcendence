# Containerized ft_transcendence stack.
# Run with: make up   (or: docker compose up -d --build)
#
# Topology (Phases 0–2):
#   browser --HTTPS:443--> gateway (nginx) --/api--> auth-service --> postgres
#                                            \----> grafana, prometheus (UIs)
#   prometheus --scrape--> auth-service, user-service, exporters, blackbox probe
#
# Networks:
#   web — gateway-facing: services, UIs and exporters. The only network with
#         published access (through the gateway's TLS listener).
#   db  — auth-service/user-service/exporters <-> postgres, internal.

name: ftx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db
    restart: unless-stopped

  # One-shot job: applies auth-service migrations (golang-migrate naming
  # convention: NNNNNN_name.up.sql / .down.sql, tracked in schema_migrations).
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/auth-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    restart: "no"

  # ── service template: copy this block per docs/NEW-SERVICE.md ────────────
  # my-service:
  #   build:
  #     context: ./backend
  #     dockerfile: my-service/Dockerfile
  #   environment:
  #     PORT: "8080"
  #     APP_ENV: ${APP_ENV}
  #     LOG_FORMAT: ${LOG_FORMAT}
  #     LOG_LEVEL: ${LOG_LEVEL}
  #     # only the env this service actually needs:
  #     # DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mydb?sslmode=disable
  #     # JWT_SECRET: ${JWT_SECRET}
  #   networks:
  #     - web        # always, if the gateway routes to it
  #     # - db        # only if it owns SQL tables
  #   restart: unless-stopped
  # ──────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web
      - db
    restart: unless-stopped

  # One-shot job: create the user-service database on the shared instance
  # (one database per service). user-service migrates itself at startup.
  user-db-init:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./scripts/init-user-db.sh:/init-user-db.sh:ro
    entrypoint: ["sh", "/init-user-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    restart: "no"

  # Teammate service (Umut's workstream): liveness/readiness on /healthz and
  # /readyz, which sit outside /api/v1 and are therefore not proxied. No
  # gateway route yet — it gains one when it grows public API endpoints.
  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user?sslmode=disable
      MIGRATE_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      user-db-init:
        condition: service_completed_successfully
    networks:
      - web
      - db
    restart: unless-stopped

  # ── monitoring stack (issues #73–79) ─────────────────────────────────────
  # No published ports: the UIs are reached through the gateway's TLS listener
  # at /grafana (own login) and /prometheus (nginx basic auth).

  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://localhost:${HTTPS_PORT}/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Issue #78: no anonymous access, no sign-up, admin password from .env —
      # never the image default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://localhost:${HTTPS_PORT}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - web
    restart: unless-stopped

  # PostgreSQL metrics; bridges db -> web so Prometheus never joins db.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - web
      - db
    restart: unless-stopped

  # Host CPU/memory/disk metrics for the infrastructure alerts (#77).
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - web
    restart: unless-stopped

  # Runs the end-to-end HTTPS probe of the gateway chain (gateway-probe job).
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.26.0
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - web
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service
      - prometheus
      - grafana
    networks:
      - web
    restart: unless-stopped

networks:
  web:
  db:
    internal: true

volumes:
  pgdata:
  prometheus-data:
  grafana-data: