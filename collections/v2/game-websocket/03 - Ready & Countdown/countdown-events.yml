              "avatar_url": "/static/avatars/default/43.svg",
              "team": "RED",
              "role": "OPERATIVE",
              "ready": true,
              "state": "IN_LOBBY",
              "is_host": false,
              "joined_at": "2026-09-10T08:41:20Z"
