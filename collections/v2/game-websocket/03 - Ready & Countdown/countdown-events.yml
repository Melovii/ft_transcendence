  ```

  ```json
    {
      "type": "room.countdown.tick",
      "event_id": "evt_0134",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:43:13Z",
      "payload": {
        "seconds_remaining": 2
      }
    }
  ```

  ```json
    {
      "type": "room.countdown.tick",
      "event_id": "evt_0135",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:43:14Z",
      "payload": {
        "seconds_remaining": 1
      }
    }
  ```

  ```json
    {
      "type": "room.countdown.tick",
      "event_id": "evt_0136",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:43:15Z",
      "payload": {
        "seconds_remaining": 0
      }
    }
  ```

  The next event is `game.started` with room status `IN_GAME`, `game_id=5001`, and a recipient-safe board.

  ## Complete cancellation sequence

  If user `43` sets ready false at two seconds:

  ```json
    {
      "type": "room.countdown.cancelled",
      "event_id": "evt_0140",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:44:01Z",
      "payload": {
        "reason": "PLAYER_UNREADY",
        "changed_by_user_id": 43
      }
    }
  ```

  ```json
    {
      "type": "room.state",
      "event_id": "evt_0141",
      "room_id": 1001,
      "sent_at": "2026-09-10T08:44:01Z",
      "payload": {
        "room": {
          "room_id": 1001,
          "room_code": "ABCD12",
          "status": "WAITING",
          "host_user_id": 42,
          "player_count": 4,
          "max_players": 8,
          "startable": false,
          "players": [
            {
              "user_id": 42,
              "username": "player_one",
              "avatar_url": "/static/avatars/default/42.svg",
              "team": "RED",
              "role": "SPYMASTER",
              "ready": true,
              "state": "IN_LOBBY",
              "is_host": true,
              "joined_at": "2026-09-10T08:41:00Z"
            },
            {
              "user_id": 43,
              "username": "red_agent",
              "avatar_url": "/static/avatars/default/43.svg",
              "team": "RED",
              "role": "OPERATIVE",
              "ready": false,
              "state": "IN_LOBBY",
              "is_host": false,
              "joined_at": "2026-09-10T08:41:20Z"
            },
            {
              "user_id": 44,
              "username": "blue_master",
              "avatar_url": "/static/avatars/default/44.svg",
              "team": "BLUE",
              "role": "SPYMASTER",
              "ready": true,
              "state": "IN_LOBBY",
              "is_host": false,
              "joined_at": "2026-09-10T08:41:30Z"
            },
            {
              "user_id": 45,
              "username": "blue_agent",
              "avatar_url": "/static/avatars/default/45.svg",
              "team": "BLUE",
              "role": "OPERATIVE",
              "ready": true,
              "state": "IN_LOBBY",
              "is_host": false,
              "joined_at": "2026-09-10T08:41:40Z"
            }
          ],
          "game": null,
          "created_at": "2026-09-10T08:41:00Z"
        }
      }
    }
  ```

  The cancelled snapshot omits `countdown`; remaining scheduled ticks and `game.started` MUST NOT be emitted.

  ## State and errors

  Events are server-generated and have no action-level errors. The server rechecks all invariants immediately before creating the board; stale timer completion cannot start an invalid room.
