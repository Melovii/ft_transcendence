docs:
  content: |-
    # ft_transcendence REST API v1

    ## Transport and session

    Base URL: `{{baseUrl}}` (`http://localhost:3000` locally). JSON requests send `Content-Type: application/json`; JSON responses send the same media type. Protected endpoints require the `ft_session` cookie (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`) — sent automatically by a browser, and by Bruno through its cookie jar. There is no header-based user credential and no token value in any response body; see `workspace.yml`, Session and Credential Model. `POST /api/v1/auth/refresh` reads the separate `ft_refresh` cookie (`Path=/api/v1/auth/refresh`) and reissues both cookies. Tokens are never URL parameters.

    ## Response envelopes

    **Service ownership:** `/api/v1/auth/*` routes to Auth Service (`auth-service`). Profile/search, avatar, friends/requests, blocking, reports and account deletion route to User Service (`user-service`). Stats owns match-history records and profile statistics; Game Session owns room membership. Every protected route validates the session through Auth, while domain authorization belongs to the owning service. Public URLs, cookie rules and response schemas are shared browser contracts, not a shared backend deployment or database. See `workspace.yml`, Auth and User Service Boundary.

    Every non-empty success is `{ "data": value }`. `204 No Content` has no body. Every error is `{ "error": { "code": string, "message": string, "details": object } }`; `details` is always an object and may be empty.

    ## Endpoint matrix

    | Method | Path | Purpose | Auth | Main requirement |
    | --- | --- | --- | --- | --- |
    | `GET` | `/api/v1/health` | Contract/service health | no | none |
    | `POST` | `/api/v1/auth/register` | Create account + issue session pair | no | unique email + username |
    | `POST` | `/api/v1/auth/login` | Issue a new session pair | no | valid email + password |
    | `POST` | `/api/v1/auth/refresh` | Exchange refresh token for new access token | refresh token | unexpired, unrevoked refresh token |
    | `GET` | `/api/v1/auth/session` | Read current session identity | yes | active access token |
    | `DELETE` | `/api/v1/auth/session` | Revoke current session (v1 `IN_GAME` forfeits; v2 applies leave rules) | yes | active access token |
    | `GET` | `/api/v1/auth/oauth/google/authorize` | Start Google sign-in (browser redirect) | no | none |
    | `GET` | `/api/v1/auth/oauth/google/callback` | Complete Google sign-in; issue session pair | `ft_oauth` cookie | valid `state` and code |
    | `GET` | `/api/v1/users/me` | Own persistent profile | yes | active session |
    | `PATCH` | `/api/v1/users/me` | Update own profile (`username`) | yes | active session |
    | `DELETE` | `/api/v1/users/me` | Permanently delete own account | yes | `confirm_username` matches |
    | `POST` | `/api/v1/users/me/avatar` | Upload/replace avatar | yes | active session, valid image |
    | `GET` | `/api/v1/users/me/matches` | Own match history (paginated) | yes | active session |
    | `GET` | `/api/v1/users/{user_id}` | Public persistent profile | yes | user exists |
    | `POST` | `/api/v1/users/{user_id}/reports` | Report another user | yes | target exists, not self |
    | `GET` | `/api/v1/users/search?q=&limit=&offset=` | Offset-paginated username search for friend discovery | yes | active session |
    | `POST` | `/api/v1/rooms` | Create and host a room | yes | not in active room |
    | `POST` | `/api/v1/rooms/{room_id}/members` | Join a room | yes | `WAITING`, not in active room |
    | `GET` | `/api/v1/rooms/{room_id}` | Role-safe room/game snapshot | yes | room member |
    | `DELETE` | `/api/v1/rooms/{room_id}/members/me` | Leave room (forfeits if `IN_GAME`) | yes | room member |
    | `GET` | `/api/v1/rooms/lookup/{room_code}` | Resolve room code to room ID | yes | active room with that code |
    | `GET` | `/api/v1/friends?limit=&offset=` | Offset-paginated friends with snapshot presence | yes | active session |
    | `POST` | `/api/v1/friends/requests` | Send a friend request | yes | target exists, not self, no block, no friendship or pending request |
    | `GET` | `/api/v1/friends/requests` | Pending incoming and outgoing friend requests | yes | active session |
    | `POST` | `/api/v1/friends/requests/{request_id}/accept` | Accept a request; become friends | yes | request pending for the caller |
    | `POST` | `/api/v1/friends/requests/{request_id}/decline` | Decline a request | yes | request pending for the caller |
    | `DELETE` | `/api/v1/friends/requests/{request_id}` | Cancel the caller's own pending request | yes | request pending, sent by the caller |
    | `DELETE` | `/api/v1/friends/{user_id}` | Remove a friend | yes | active friendship exists |
    | `PUT` | `/api/v1/users/{user_id}/block` | Block a user (idempotent) | yes | target exists, not self |
    | `DELETE` | `/api/v1/users/{user_id}/block` | Lift own block (idempotent) | yes | target exists, not self |

    ## Status conventions

    `200` reads/updates/accept/block; `201` creation/join/friend request; `204` session or account deletion, leave/remove; `302` OAuth redirects; `400` malformed syntax; `401` authentication (`UNAUTHORIZED` for a bad access credential, `SESSION_EXPIRED` for a bad refresh credential); `403` access; `404` missing entity; `409` uniqueness/lifecycle conflict; `422` field validation; `429` throttling.

    ## Domain and lifetime

    IDs are positive integers, timestamps are ISO 8601 UTC, JSON is snake_case, and enums are UPPER_SNAKE_CASE. Profiles expose persistent `username`, `avatar_url`, `wins`, `losses`, `level`, and match history. Room team, role, readiness, board, clue, turn, and score are temporary. `room_id` (internal, path key) and `room_code` (`^[A-Z0-9]{6}$`, human-shareable) are distinct and never interchangeable — see `workspace.yml`, Room Identifier Consistency.

    ## REST/WebSocket boundary

    REST bootstraps identity, session refresh, profile/avatar, friends, and membership, and returns recoverable snapshots. Team/role/readiness and gameplay mutations are WebSocket-only. The REST room snapshot is server-authoritative and recipient-specific: an Operative never receives unrevealed card colors. `Leave room` is now legal in every room status, including `IN_GAME` (it forfeits the match — see `workspace.yml`, Room Abandonment).

    ## Example index

    - Minimum and invalid waiting rooms: `03 - Rooms/Get room snapshot`
    - Joinability and membership failures: `03 - Rooms/Join room`
    - Complete started-game Operative projection: `03 - Rooms/Get room snapshot`
    - Room-code join preview: `03 - Rooms/Lookup room by code`
    - Countdown and both role projections: WebSocket `07 - Full State Scenarios`
    - Clue and all reveal outcomes, plus forfeit: WebSocket `04 - Game`

    ## Environment

    Select `local`. Bruno authenticates through its cookie jar exactly like a browser — Register/Login/Refresh set `ft_session`/`ft_refresh` cookies automatically, no variable wiring needed. Registration stores `userId`; room creation stores `roomId`. The canonical fixtures use users `42` through `47`, room `1001`, and game `5001`.
  type: text/markdown
bundled: false
extensions: {}
