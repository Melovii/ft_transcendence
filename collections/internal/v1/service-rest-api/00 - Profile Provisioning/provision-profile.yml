info:
  name: Provision profile
  type: http
  seq: 1
  tags: [internal, provisioning]
http:
  method: PUT
  url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
  headers:
    - name: Authorization
      value: "Bearer {{authToUserServiceCredential}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": 42,
        "username": "player_one",
        "created_at": "2026-11-05T09:30:00.123456Z"
      }
docs: |-
  # Provision profile

  User Service creates exactly one canonical profile with the deterministic default avatar for an Auth-assigned `user_id`, or returns the stored receipt for an identical retry. Caller: `auth-service` only, scope `profile.provision`. See the folder documentation for operation identity, decision order and retry rules.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `operation_id` | path | yes | string | UUID; normalized to lowercase | no | Auth's durable provisioning operation | `6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40` |
  | `Authorization` | header | yes | string | `Bearer` + Auth-to-User credential | no | Service credential | local secret |
  | `Content-Type` | header | yes | string | `application/json` | no | Request media type | `application/json` |
  | `user_id` | body | yes | integer | positive | no | Auth-assigned user ID | `42` |
  | `username` | body | yes | string | after trimming: 3 to 20 of `A-Z`, `a-z`, `0-9`, `_` | no | Requested canonical username | `player_one` |
  | `created_at` | body | yes | string | ISO 8601 with offset | no | Auth account creation time | `2026-11-05T09:30:00.123456Z` |

  The body is exactly one JSON object with these three fields. Unknown or missing fields, malformed JSON and additional JSON values return `400 VALIDATION_ERROR`.

  ## Responses

  - `201`: this request created the profile. Body: receipt.
  - `200`: identical replay of a completed operation. Body: the same receipt as the original `201`.

  ## Errors

  | Status | Code | Condition | `details` |
  | --- | --- | --- | --- |
  | `400` | `VALIDATION_ERROR` | Malformed body or unknown/missing fields | `{ "field": "body" }` |
  | `401` | `SERVICE_UNAUTHENTICATED` | Missing or unknown service credential | `{}` |
  | `403` | `SERVICE_FORBIDDEN` | Caller lacks `profile.provision` | `{}` |
  | `409` | `OPERATION_CONFLICT` | `operation_id` exists with a different canonical request | `{ "operation_id": string }` |
  | `409` | `USER_ALREADY_PROVISIONED` | Another operation or an existing profile already owns `user_id` | `{ "user_id": integer }` |
  | `409` | `USER_DELETED` | Account deletion is recorded for `user_id` | `{ "user_id": integer }` |
  | `409` | `USERNAME_TAKEN` | Another user holds the normalized username | `{ "field": "username" }` |
  | `422` | `VALIDATION_ERROR` | Invalid `operation_id`, `user_id` or `created_at` value | `{ "field": string }` |
  | `422` | `INVALID_USERNAME` | Username breaks the username rule | `{ "field": "username" }` |
  | `500` | `INTERNAL_ERROR` | Unexpected failure; nothing was written | `{}` |
  | `503` | `SERVICE_UNAVAILABLE` | Database unavailable; nothing was written | `{}` |

  ## State changes and events

  A `201` commits the operation record and the profile in one PostgreSQL transaction. Every other result writes nothing. Profile integration events, when introduced, are committed through the User transactional outbox in the same transaction.
examples:
  - name: Success - created
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 201
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "operation_id": "6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40",
              "user_id": 42,
              "outcome": "PROVISIONED",
              "completed_at": "2026-11-05T09:30:00.245789Z"
            }
          }
  - name: Success - identical replay
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "operation_id": "6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40",
              "user_id": 42,
              "outcome": "PROVISIONED",
              "completed_at": "2026-11-05T09:30:00.245789Z"
            }
          }
  - name: Error - Conflicting replay
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "Player_One",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "OPERATION_CONFLICT",
              "message": "This provisioning operation already exists with different data.",
              "details": {
                "operation_id": "6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
              }
            }
          }
  - name: Error - User already provisioned
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/0c7d2a91-4e6b-4f1a-b3c8-95e2d7f60a13"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_ALREADY_PROVISIONED",
              "message": "Another provisioning operation already owns this user.",
              "details": {
                "user_id": 42
              }
            }
          }
  - name: Error - User deleted
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_DELETED",
              "message": "Account deletion is recorded for this user.",
              "details": {
                "user_id": 42
              }
            }
          }
  - name: Error - Username taken
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/9e4a6c13-2b7f-4d8e-a105-6f3c8b2d7e94"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 43,
            "username": "PLAYER_ONE",
            "created_at": "2026-11-05T09:31:00.000000Z"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USERNAME_TAKEN",
              "message": "That username is already taken.",
              "details": {
                "field": "username"
              }
            }
          }
  - name: Error - Invalid username
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/9e4a6c13-2b7f-4d8e-a105-6f3c8b2d7e94"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 43,
            "username": "no spaces!",
            "created_at": "2026-11-05T09:31:00.000000Z"
          }
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_USERNAME",
              "message": "Username must be 3 to 20 letters, digits or underscores.",
              "details": {
                "field": "username"
              }
            }
          }
  - name: Error - Unknown body field
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/9e4a6c13-2b7f-4d8e-a105-6f3c8b2d7e94"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 43,
            "username": "blue_agent",
            "created_at": "2026-11-05T09:31:00.000000Z",
            "avatar_url": "https://example.com/a.png"
          }
    response:
      status: 400
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "Body must be one JSON object with user_id, username and created_at.",
              "details": {
                "field": "body"
              }
            }
          }
  - name: Error - Invalid operation_id
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/not-a-uuid"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 43,
            "username": "blue_agent",
            "created_at": "2026-11-05T09:31:00.000000Z"
          }
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "operation_id must be a UUID.",
              "details": {
                "field": "operation_id"
              }
            }
          }
  - name: Error - Missing service credential
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 401
      headers: [{name: Content-Type, value: application/json}, {name: WWW-Authenticate, value: Bearer}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SERVICE_UNAUTHENTICATED",
              "message": "Service credentials are missing or invalid.",
              "details": {}
            }
          }
  - name: Error - Caller not permitted
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer <game-session-to-user credential>", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 403
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SERVICE_FORBIDDEN",
              "message": "This service is not allowed to perform this operation.",
              "details": {}
            }
          }
  - name: Error - Database unavailable
    request:
      url: "{{userInternalUrl}}/internal/v1/provisioning-operations/6b1f0c2e-9a4d-4c7e-8f3b-2d5e7a9c1b40"
      method: PUT
      headers: [{name: Authorization, value: "Bearer {{authToUserServiceCredential}}", enabled: true}, {name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "user_id": 42,
            "username": "player_one",
            "created_at": "2026-11-05T09:30:00.123456Z"
          }
    response:
      status: 503
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SERVICE_UNAVAILABLE",
              "message": "The service is temporarily unavailable.",
              "details": {}
            }
          }
