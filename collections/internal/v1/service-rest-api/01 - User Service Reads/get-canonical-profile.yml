info:
  name: Get canonical profile
  type: http
  seq: 1
  tags: [internal, profile]
http:
  method: GET
  url: "{{userInternalUrl}}/internal/v1/profiles/42"
  headers:
    - name: Authorization
      value: "Bearer {{authToUserServiceCredential}}"
    - name: Accept
      value: application/json
docs: |-
  # Get canonical profile

  Returns the current canonical profile fields for one user. Scope `profile.read`. Callers use it to compose their own responses with current profile data; an old JWT, cached username or provisioning receipt never replaces it. No credentials, login email, presence, statistics or relationship fields are returned.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `user_id` | path | yes | integer | positive | no | Target user | `42` |
  | `Authorization` | header | yes | string | `Bearer` + the caller's credential for User Service | no | Service credential | local secret |

  ## Response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.user_id` | integer | yes | no | positive | User ID |
  | `data.username` | string | yes | no | username rule | Current canonical username |
  | `data.avatar_url` | string | yes | no | URL | Uploaded or preset avatar, or the deterministic default |
  | `data.created_at` | string | yes | no | ISO 8601 UTC | Account creation time supplied at provisioning |

  ## Errors

  | Status | Code | Condition | `details` |
  | --- | --- | --- | --- |
  | `401` | `SERVICE_UNAUTHENTICATED` | Missing or unknown service credential | `{}` |
  | `403` | `SERVICE_FORBIDDEN` | Caller lacks `profile.read` | `{}` |
  | `404` | `USER_NOT_FOUND` | No profile exists for `user_id` | `{ "user_id": integer }` |
  | `409` | `USER_DELETED` | Account deletion is recorded for `user_id` | `{ "user_id": integer }` |
  | `422` | `VALIDATION_ERROR` | `user_id` is not a positive integer | `{ "field": "user_id" }` |
  | `500` | `INTERNAL_ERROR` | Unexpected failure | `{}` |
  | `503` | `SERVICE_UNAVAILABLE` | Database unavailable | `{}` |

  A profile exists only after its provisioning operation committed, so User has no partially provisioned profile state. `USER_DELETED` grants no domain access.
examples:
  - name: Success
    request: {url: "{{userInternalUrl}}/internal/v1/profiles/42", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user_id": 42,
              "username": "player_one",
              "avatar_url": "https://{{baseUrl}}/static/avatars/default/42.svg",
              "created_at": "2026-11-05T09:30:00.123456Z"
            }
          }
  - name: Error - User not found
    request: {url: "{{userInternalUrl}}/internal/v1/profiles/9999", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 404
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_NOT_FOUND",
              "message": "User 9999 was not found.",
              "details": {
                "user_id": 9999
              }
            }
          }
  - name: Error - User deleted
    request: {url: "{{userInternalUrl}}/internal/v1/profiles/42", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_DELETED",
              "message": "Account deletion is recorded for this user.",
              "details": {
                "user_id": 42
              }
            }
          }
